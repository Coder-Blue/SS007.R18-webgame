name: Feature request
description: Propose a mechanic, interface change or tooling improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Large features need an issue before implementation. Explain the player outcome and the economic or interface consequence.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or frustrating today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest complete change that solves the problem.
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Primary layer
      options:
        - domain
        - state
        - scene
        - ui
        - routes
        - tooling or CI
    validations:
      required: true

  - type: textarea
    id: economics
    attributes:
      label: Economic consequence
      description: Which households, workshops, tariffs, debt or reliability values move, and in which direction?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What simpler design was rejected, and why?
    validations:
      required: false
