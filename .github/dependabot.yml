version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      solid-and-tanstack:
        patterns:
          - "@solidjs/*"
          - "solid-js"
          - "@tanstack/*"
      tooling:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "@oxlint/*"
          - "lefthook"
          - "vitest"
          - "@vitest/*"
          - "vite"
          - "typescript"
    labels:
      - deps
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "@iconify-json/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Ho_Chi_Minh
    labels:
      - ci
    commit-message:
      prefix: "ci(deps)"
