allowBuilds:
  esbuild: true
  lefthook: true

# The Nix dev shell runs a glibc Node on a musl host. Install both libc
# variants of native optional dependencies so Rolldown can follow the runtime
# report after the checked-in patch.
supportedArchitectures:
  os:
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

patchedDependencies:
  '@iconify-icon/solid@3.0.6': patches/@iconify-icon__solid@3.0.6.patch
  '@tanstack/start-server-core@1.169.45': patches/@tanstack__start-server-core@1.169.45.patch
  oxfmt@0.79.0: patches/oxfmt@0.79.0.patch
  oxlint@1.94.0: patches/oxlint@1.94.0.patch
  rolldown@1.2.19: patches/rolldown@1.2.19.patch
  rolldown@1.3.3: patches/rolldown@1.3.3.patch

minimumReleaseAgeExclude:
  - '@takumi-rs/core-darwin-arm64@2.22.1'
  - '@takumi-rs/core-darwin-x64@2.22.1'
  - '@takumi-rs/core-linux-arm64-gnu@2.22.1'
  - '@takumi-rs/core-linux-arm64-musl@2.22.1'
  - '@takumi-rs/core-linux-x64-gnu@2.22.1'
  - '@takumi-rs/core-linux-x64-musl@2.22.1'
  - '@takumi-rs/core-win32-arm64-msvc@2.22.1'
  - '@takumi-rs/core-win32-x64-msvc@2.22.1'
  - '@takumi-rs/core@2.22.1'
  - '@takumi-rs/helpers@2.22.1'
  - '@takumi-rs/wasm@2.22.1'
  - takumi-js@2.22.1
